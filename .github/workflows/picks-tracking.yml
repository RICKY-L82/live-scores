name: Track picks history

on:
  schedule:
    # 16:23 UTC ~= 11:23 ET / 00:23 Taiwan next day: lines are posted by
    # then and it leaves room before the evening slate. The old "0 21" slot
    # actually fired 23:40-02:40 UTC (GitHub delays top-of-hour schedules by
    # hours), after the 19:00 ET NBA tip-offs, so most games had already
    # started and were filtered out. An off-hour minute also avoids the
    # top-of-hour queue. Settlement runs first in the same job since by this
    # time every league's previous games are long finished.
    # GitHub still delays these by up to ~8h (16:23 fired at 00:19 UTC on
    # 11/10, after three 19:00 ET tip-offs), so two backup slots follow; all
    # three land on the same Taiwan date and record-picks.js leaves a day
    # that already has picks untouched, so whichever runs first records.
    - cron: "23 16 * * *"
    - cron: "53 18 * * *"
    - cron: "37 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picks-tracking
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Settle pending picks
        run: node scripts/settle-picks.js

      - name: Record today's picks
        run: node scripts/record-picks.js

      # always(): if recording fails, the settle step's results are still saved
      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "picks-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/picks-history data/picks-stats.json
          if git diff --cached --quiet; then
            echo "No picks-tracking changes."
            exit 0
          fi
          git commit -m "picks: track $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # the other workflow may push between our pull and push; retry
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying"
            sleep $((i * 5))
          done
          exit 1
