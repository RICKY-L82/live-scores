name: Collect odds snapshots

on:
  schedule:
    # every 20 minutes, off the top of the hour: "*/20" (:00/:20/:40) landed
    # in GitHub's busiest slots and in practice ran only ~4 times a day
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-odds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect odds
        run: node scripts/collect-odds.js

      - name: Collect NBA team/player stats
        run: node scripts/collect-nba-stats.js
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "odds-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/odds data/nba
          if git diff --cached --quiet; then
            echo "No odds changes."
            exit 0
          fi
          git commit -m "odds: snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # the other workflow may push between our pull and push; retry
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying"
            sleep $((i * 5))
          done
          exit 1
